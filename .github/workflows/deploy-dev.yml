name: Deploy naar DEV

on:
  push:
    branches:
      - develop

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  ACA_RESOURCE_GROUP: ${{ secrets.ACA_RESOURCE_GROUP }}
  APP_NAME: [APP_NAME]-dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Inloggen op Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Inloggen op Azure Container Registry
        run: az acr login --name $ACR_NAME

      - name: Docker image bouwen en pushen
        run: |
          IMAGE="${ACR_LOGIN_SERVER}/[APP_NAME]:dev-${GITHUB_SHA:0:8}"
          docker build --build-arg VITE_APP_ENV="dev" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Dependencies installeren
        run: npm ci --legacy-peer-deps

      - name: Database-migraties uitvoeren
        run: node scripts/db/run-migrations.js
        env:
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING_DEV }}

      - name: Container App bijwerken
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$ACA_RESOURCE_GROUP" \
            --image "$IMAGE"
