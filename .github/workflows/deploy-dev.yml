name: Deploy naar DEV

on:
  push:
    branches:
      - develop

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  ACA_RESOURCE_GROUP: ${{ secrets.ACA_RESOURCE_GROUP }}
  KEY_VAULT_NAME: ${{ secrets.KEY_VAULT_NAME_DEV }}
  APP_NAME: vendorportal-dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Inloggen op Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Inloggen op Azure Container Registry
        run: az acr login --name $ACR_NAME

      - name: Docker image bouwen en pushen
        run: |
          IMAGE="${ACR_LOGIN_SERVER}/vendorportal:dev-${GITHUB_SHA:0:8}"
          docker build --build-arg VITE_APP_ENV="dev" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Dependencies installeren
        run: npm ci --legacy-peer-deps

      - name: Database-migraties uitvoeren
        run: node scripts/db/run-migrations.js
        env:
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING_DEV }}

      - name: Container App bijwerken
        run: |
          az containerapp secret set \
            --name "$APP_NAME" \
            --resource-group "$ACA_RESOURCE_GROUP" \
            --secrets \
              sql-connection-string="keyvaultref:https://${KEY_VAULT_NAME}.vault.azure.net/secrets/sql-connection-string-dev,identityref:system" \
              session-secret="keyvaultref:https://${KEY_VAULT_NAME}.vault.azure.net/secrets/session-secret-dev,identityref:system"

          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$ACA_RESOURCE_GROUP" \
            --set-env-vars \
              SQL_CONNECTION_STRING=secretref:sql-connection-string \
              SESSION_SECRET=secretref:session-secret

          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$ACA_RESOURCE_GROUP" \
            --image "$IMAGE"

      - name: Deploy-validatie (health + revision)
        run: |
          FQDN="$(az containerapp show --name "$APP_NAME" --resource-group "$ACA_RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
          REVISION="$(az containerapp show --name "$APP_NAME" --resource-group "$ACA_RESOURCE_GROUP" --query properties.latestRevisionName -o tsv)"

          echo "Container App FQDN: $FQDN"
          echo "Laatste revision: $REVISION"

          curl --fail --silent --show-error "https://${FQDN}/api/health"
