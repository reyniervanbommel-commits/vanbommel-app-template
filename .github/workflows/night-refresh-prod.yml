name: Night D365 refresh (production)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: night-refresh-prod
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Start night refresh
        env:
          PROD_APP_URL: ${{ secrets.PROD_APP_URL }}
          NIGHT_REFRESH_TOKEN: ${{ secrets.NIGHT_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PROD_APP_URL:-}" ] || [ -z "${NIGHT_REFRESH_TOKEN:-}" ]; then
            echo "::error::PROD_APP_URL or NIGHT_REFRESH_TOKEN is missing"
            exit 1
          fi
          BASE="${PROD_APP_URL%/}"
          BODY="$(curl -sS --fail-with-body --max-time 60 \
            -X POST "${BASE}/api/internal/night-refresh" \
            -H "Authorization: Bearer ${NIGHT_REFRESH_TOKEN}" \
            -H "Content-Type: application/json")"
          echo "Start accepted"
          echo "$BODY" | grep -q '"attached"' || true

          for i in $(seq 1 90); do
            STATUS_JSON="$(curl -sS --max-time 30 \
              -H "Authorization: Bearer ${NIGHT_REFRESH_TOKEN}" \
              "${BASE}/api/internal/night-refresh/status" || true)"
            STATUS="$(printf '%s' "$STATUS_JSON" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')"
            RUNNING="$(printf '%s' "$STATUS_JSON" | sed -n 's/.*"running":\([^,}]*\).*/\1/p')"
            FINISHED="$(printf '%s' "$STATUS_JSON" | sed -n 's/.*"finishedAt":"\([^"]*\)".*/\1/p')"

            if [ "$i" -eq 1 ] && [ "$RUNNING" = "false" ] && [ -z "$FINISHED" ]; then
              echo "::error::Night refresh did not start (app down or crash)"
              exit 1
            fi
            if [ "$STATUS" = "error" ] || [ "$STATUS" = "interrupted" ]; then
              echo "::error::Night refresh ended with status ${STATUS}"
              exit 1
            fi
            if [ "$STATUS" = "done" ]; then
              echo "Night refresh done"
              exit 0
            fi
            sleep 30
          done

          echo "::error::Night refresh timed out"
          exit 1
