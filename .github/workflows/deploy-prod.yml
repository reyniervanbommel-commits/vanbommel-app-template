name: Deploy naar Productie

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Typ "deploy-prod" om te bevestigen'
        required: true

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  ACA_RESOURCE_GROUP: ${{ secrets.ACA_RESOURCE_GROUP }}
  KEY_VAULT_NAME: ${{ secrets.KEY_VAULT_NAME_PROD }}
  APP_NAME: vendorportal-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.confirm == 'deploy-prod'

    steps:
      - uses: actions/checkout@v4

      - name: Inloggen op Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Inloggen op Azure Container Registry
        run: az acr login --name $ACR_NAME

      - name: Docker image bouwen en pushen
        run: |
          IMAGE="${ACR_LOGIN_SERVER}/vendorportal:prod-${GITHUB_SHA:0:8}"
          docker build --build-arg VITE_APP_ENV="production" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Dependencies installeren
        run: npm ci --legacy-peer-deps

      - name: Database-migraties uitvoeren
        run: node scripts/db/run-migrations.js
        env:
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING_PROD }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_DISPLAY_NAME: ${{ secrets.BOOTSTRAP_ADMIN_DISPLAY_NAME }}

      - name: Container App bijwerken
        run: |
          az containerapp secret set \
            --name "$APP_NAME" \
            --resource-group "$ACA_RESOURCE_GROUP" \
            --secrets \
              sql-connection-string="keyvaultref:https://${KEY_VAULT_NAME}.vault.azure.net/secrets/sql-connection-string-prod,identityref:system" \
              session-secret="keyvaultref:https://${KEY_VAULT_NAME}.vault.azure.net/secrets/session-secret-prod,identityref:system" \
              d365-base-url="keyvaultref:https://${KEY_VAULT_NAME}.vault.azure.net/secrets/D365-ODATA-PROD-BASE-URL,identityref:system" \
              d365-tenant-id="keyvaultref:https://${KEY_VAULT_NAME}.vault.azure.net/secrets/D365-ODATA-PROD-TENANT-ID,identityref:system" \
              d365-client-id="keyvaultref:https://${KEY_VAULT_NAME}.vault.azure.net/secrets/D365-ODATA-PROD-CLIENT-ID,identityref:system" \
              d365-client-secret="keyvaultref:https://${KEY_VAULT_NAME}.vault.azure.net/secrets/D365-ODATA-PROD-CLIENT-SECRET,identityref:system" \
              d365-secret-expires-at="keyvaultref:https://${KEY_VAULT_NAME}.vault.azure.net/secrets/D365-ODATA-PROD-CLIENT-SECRET-EXPIRES-AT,identityref:system"

          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$ACA_RESOURCE_GROUP" \
            --set-env-vars \
              SQL_CONNECTION_STRING=secretref:sql-connection-string \
              SESSION_SECRET=secretref:session-secret \
              APP_ENV=production \
              D365_ODATA_BASE_URL=secretref:d365-base-url \
              D365_ODATA_TENANT_ID=secretref:d365-tenant-id \
              D365_ODATA_CLIENT_ID=secretref:d365-client-id \
              D365_ODATA_CLIENT_SECRET=secretref:d365-client-secret \
              D365_ODATA_CLIENT_SECRET_EXPIRES_AT=secretref:d365-secret-expires-at \
              D365_ODATA_COMPANY=WHSL

          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$ACA_RESOURCE_GROUP" \
            --image "$IMAGE"

      - name: Deploy-validatie (health + revision)
        run: |
          FQDN="$(az containerapp show --name "$APP_NAME" --resource-group "$ACA_RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
          REVISION="$(az containerapp show --name "$APP_NAME" --resource-group "$ACA_RESOURCE_GROUP" --query properties.latestRevisionName -o tsv)"

          echo "Container App FQDN: $FQDN"
          echo "Laatste revision: $REVISION"

          curl --fail --silent --show-error "https://${FQDN}/api/health"

      - name: D365-koppeling verifiëren
        run: |
          FQDN="$(az containerapp show --name "$APP_NAME" --resource-group "$ACA_RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"

          # Deze check doet een echte entity-read, niet alleen een token-aanvraag: een geldig
          # token zegt niets over de rechten van de gekoppelde F&O-gebruiker (zie 2026-07-19,
          # waar het token slaagde maar elke read 403 gaf).
          BODY="$(curl --silent --show-error "https://${FQDN}/api/health/d365")"
          echo "$BODY"

          if ! echo "$BODY" | grep -q '"status":"ok"'; then
            echo "::error::De D365-koppeling werkt niet. Zie de melding hierboven."
            exit 1
          fi
