name: Deploy naar Productie

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Typ "deploy-prod" om te bevestigen'
        required: true

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  ACA_RESOURCE_GROUP: ${{ secrets.ACA_RESOURCE_GROUP }}
  APP_NAME: [APP_NAME]-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'deploy-prod'

    steps:
      - uses: actions/checkout@v4

      - name: Inloggen op Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Inloggen op Azure Container Registry
        run: az acr login --name $ACR_NAME

      - name: Docker image bouwen en pushen
        run: |
          IMAGE="${ACR_LOGIN_SERVER}/[APP_NAME]:prod-${GITHUB_SHA:0:8}"
          docker build --build-arg VITE_APP_ENV="production" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Dependencies installeren
        run: npm ci --legacy-peer-deps

      - name: Database-migraties uitvoeren
        run: node scripts/db/run-migrations.js
        env:
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING_PROD }}

      - name: Container App bijwerken
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$ACA_RESOURCE_GROUP" \
            --image "$IMAGE"
