name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dependencies installeren
        run: npm ci --legacy-peer-deps

      - name: Tests uitvoeren (met coverage)
        run: npm run test:coverage

      - name: Coverage-samenvatting naar job-summary
        if: always()
        run: node scripts/print-coverage-summary.js

      - name: Coverage-rapport uploaden
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dependencies installeren
        run: npm ci --legacy-peer-deps

      - name: Typecheck uitvoeren
        run: npm run typecheck

  test-coverage-hint:
    name: test-coverage-hint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Niet-blokkerend (zie CLAUDE.md → Kwaliteitspoort, punt 4 "Testen"): signaleert gewijzigde
      # kernbestanden zonder co-located test in de jobsummary. Faalt de build nooit.
      - name: Kernmappen zonder test signaleren
        run: node scripts/check-core-test-coverage.js
