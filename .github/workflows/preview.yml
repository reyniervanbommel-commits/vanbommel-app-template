name: Preview-omgeving aanmaken per feature-branch

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    types: [closed]
    branches:
      - develop

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  ACA_RESOURCE_GROUP: ${{ secrets.ACA_RESOURCE_GROUP }}
  ACA_ENVIRONMENT: ${{ secrets.ACA_ENVIRONMENT }}

# De default GITHUB_TOKEN is read-only; de stap "Preview-URL als commit-status posten"
# heeft statuses:write nodig (anders 403 "Resource not accessible by integration").
permissions:
  contents: read
  statuses: write

jobs:
  deploy-preview:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.get-url.outputs.preview_url }}
      app_name: ${{ steps.set-name.outputs.app_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Branch-naam omzetten naar container-naam
        id: set-name
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          # Verwijder feature/ prefix en normaliseer
          SLUG=$(echo "$BRANCH" | sed 's|feature/||' | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]' | sed 's/--*/-/g' | sed 's/-$//' | cut -c1-24)
          APP_NAME="preview-${SLUG}"
          echo "app_name=${APP_NAME}" >> $GITHUB_OUTPUT
          echo "image_tag=preview-${GITHUB_SHA:0:8}" >> $GITHUB_OUTPUT

      - name: Inloggen op Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Inloggen op Azure Container Registry
        run: az acr login --name $ACR_NAME

      - name: Docker image bouwen en pushen
        run: |
          IMAGE="${ACR_LOGIN_SERVER}/vendorportal:${{ steps.set-name.outputs.image_tag }}"
          docker build --build-arg VITE_APP_ENV="preview" -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Dependencies installeren
        run: npm ci --legacy-peer-deps

      - name: Typecheck uitvoeren
        run: npm run typecheck

      - name: Database-migraties uitvoeren (DEV)
        run: node scripts/db/run-migrations.js
        env:
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING_DEV }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_DISPLAY_NAME: ${{ secrets.BOOTSTRAP_ADMIN_DISPLAY_NAME }}

      - name: Container App aanmaken of bijwerken
        env:
          SQL_CONN: ${{ secrets.SQL_CONNECTION_STRING_DEV }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ACS_CONNECTION_STRING: ${{ secrets.ACS_CONNECTION_STRING }}
        run: |
          IMAGE="${ACR_LOGIN_SERVER}/vendorportal:${{ steps.set-name.outputs.image_tag }}"
          APP_NAME="${{ steps.set-name.outputs.app_name }}"

          EXISTS=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$ACA_RESOURCE_GROUP" \
            --query "name" -o tsv 2>/dev/null || echo "")

          if [ -z "$EXISTS" ]; then
            az containerapp create \
              --name "$APP_NAME" \
              --resource-group "$ACA_RESOURCE_GROUP" \
              --environment "$ACA_ENVIRONMENT" \
              --image "$IMAGE" \
              --registry-server "$ACR_LOGIN_SERVER" \
              --registry-username "${{ secrets.ACR_USERNAME }}" \
              --registry-password "${{ secrets.ACR_PASSWORD }}" \
              --target-port 3000 \
              --ingress external \
              --min-replicas 0 \
              --max-replicas 2 \
              --secrets \
                "sql-connection-string=$SQL_CONN" \
                "session-secret=$SESSION_SECRET" \
                "acs-connection-string=$ACS_CONNECTION_STRING" \
              --env-vars \
                SQL_CONNECTION_STRING=secretref:sql-connection-string \
                SESSION_SECRET=secretref:session-secret \
                ACS_CONNECTION_STRING=secretref:acs-connection-string \
                NODE_ENV=production \
                APP_ENV=preview \
                PORT=3000
          else
            az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$ACA_RESOURCE_GROUP" \
              --image "$IMAGE"
          fi

      - name: Preview-URL ophalen
        id: get-url
        run: |
          APP_NAME="${{ steps.set-name.outputs.app_name }}"
          URL=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$ACA_RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "preview_url=https://${URL}" >> $GITHUB_OUTPUT

      - name: Preview-URL als commit-status posten
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.get-url.outputs.preview_url }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              target_url: previewUrl,
              description: 'Preview-omgeving beschikbaar',
              context: 'preview-url'
            });

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Branch-naam omzetten naar container-naam
        id: set-name
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          SLUG=$(echo "$BRANCH" | sed 's|feature/||' | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]' | sed 's/--*/-/g' | sed 's/-$//' | cut -c1-24)
          APP_NAME="preview-${SLUG}"
          echo "app_name=${APP_NAME}" >> $GITHUB_OUTPUT

      - name: Inloggen op Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Container App verwijderen
        run: |
          APP_NAME="${{ steps.set-name.outputs.app_name }}"
          az containerapp delete \
            --name "$APP_NAME" \
            --resource-group "$ACA_RESOURCE_GROUP" \
            --yes 2>/dev/null || echo "App bestond niet meer"

      - name: Oude preview-images opruimen
        run: |
          # Previews zijn tijdelijk: houd de 5 meest recente preview-* image-tags,
          # verwijder de oudere zodat het container-register niet onbeperkt groeit.
          TAGS=$(az acr repository show-tags --name "$ACR_NAME" --repository vendorportal --orderby time_desc -o tsv 2>/dev/null | grep '^preview-' || true)
          echo "$TAGS" | tail -n +6 | while read -r TAG; do
            [ -n "$TAG" ] && az acr repository delete --name "$ACR_NAME" --image "vendorportal:$TAG" --yes 2>/dev/null || true
          done
          echo "Preview-images opgeschoond (laatste 5 behouden)"
